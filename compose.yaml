services:
  cupnotifier:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STATE_FILE: /data/state.json
    volumes:
      - cupnotifier-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  cupnotifier-data:
